<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pylon scene bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #05070f; color: #f2f5ff; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
  body.bare { grid-template-columns: minmax(0, 1fr); } body.bare aside { display: none; }
  #holder { min-width: 0; min-height: 0; display: grid; place-items: center; background: #02030a; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #04060f; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #tag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font: 600 13px/1 "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; background: #0a0f20f2; border: 1px solid #36427c; border-radius: 2px; padding: 8px 12px; white-space: nowrap; }
  #cap { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(calc(100% - 24px), 620px); box-sizing: border-box; background: #0a0f20f2; border: 1px solid #36427c; border-left: 3px solid #8d97c9; border-radius: 3px; padding: 8px 12px; }
  #cap.ok { border-left-color: #5fe3a1; } #cap.bad { border-left-color: #ff5d73; }
  #cap code { display: block; font: 12px/1.3 "JetBrains Mono", Consolas, monospace; color: #8d97c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  aside { padding: 14px; border-left: 1px solid #232d55; overflow: auto; }
  h1 { font-size: 17px; margin: 0 0 10px; } p { margin: 0 0 10px; color: #8d98c6; }
  select, button, input { font: inherit; color: inherit; }
  select { width: 100%; min-height: 32px; background: #0a0f20; border: 1px solid #36427c; border-radius: 3px; padding: 0 6px; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  button { min-height: 32px; padding: 0 10px; background: #18213f; border: 1px solid #36427c; border-radius: 3px; cursor: pointer; }
  button:hover { border-color: #2ee6c8; }
  pre { background: #0a0f20; border: 1px solid #232d55; border-radius: 3px; padding: 8px 10px; font: 11.5px/1.45 Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 44vh; overflow: auto; }
</style>
</head>
<body>
<div id="holder"><section id="stage"><canvas id="gl"></canvas><div id="tag"></div><div id="cap"><code id="cap-call"></code><span id="cap-text"></span></div></section></div>
<aside>
  <h1>Scene bench</h1>
  <p>Every code level's scene, with right and wrong answers. Address options: <code>?id=…&amp;t=0&amp;run=good|starter|bug|junk&amp;instant=1&amp;w=390&amp;h=370&amp;bare=1</code></p>
  <select id="lv"></select>
  <select id="test"></select>
  <div class="row"><button data-run="good">Model answer</button><button data-run="starter">Starting code</button><button data-run="bug">A planted bug</button><button data-run="junk">Returns None</button></div>
  <div class="row"><button data-nav="-1">‹ Level</button><button data-nav="1">Level ›</button><button id="again">Stage again</button><label><input type="checkbox" id="instant"> instant</label><label>speed <select id="speed" style="width:auto;margin:0"><option>1</option><option>2</option><option>4</option></select></label></div>
  <pre id="log"></pre>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/minipy-core.js"></script>
<script src="../js/minipy-parse.js"></script>
<script src="../js/minipy-compile.js"></script>
<script src="../js/minipy-lib.js"></script>
<script src="../js/minipy-mods.js"></script>
<script src="../js/prelude.js"></script>
<script src="../js/runner.js"></script>
<script src="../js/bughunt.js"></script>
<script src="../js/levels-z1.js"></script>
<script src="../js/levels-z2.js"></script>
<script src="../js/levels-z3.js"></script>
<script src="../js/levels-z4.js"></script>
<script src="../js/levels-z5.js"></script>
<script src="../js/levels-z6.js"></script>
<script src="../js/levels-z7.js"></script>
<script src="../js/levels-z8.js"></script>
<script src="../js/levels-z9.js"></script>
<script src="../js/toolcards.js"></script>
<script src="../js/curriculum.js"></script>
<script src="../js/scenes.js"></script>
<script src="../js/world.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const Runner = window.PylonRunner, Scenes = window.PylonScenes, World = window.PylonWorld, Bugs = window.PylonBugs, Curriculum = window.PylonCurriculum;
const ZONES = Curriculum.FLOORS.map((f, k) => ({ n: k + 1, name: f.name, color: f.color, title: f.title }));
const LEVELS = Curriculum.arrange(window.PYLON_LEVELS || []).levels, CODE = LEVELS.filter(l => l.kind === 'code');
let cur = null, plan = null, busy = false;
if (q.get('bare')) document.body.classList.add('bare');
if (q.get('w')) { $('stage').style.width = q.get('w') + 'px'; $('stage').style.height = (q.get('h') || 370) + 'px'; }
const caption = (text, kind) => { $('cap-text').textContent = text || ''; $('cap').className = kind || ''; World.setInsets(46, $('cap').offsetHeight + 14); };
const meta = lv => ({ color: ZONES[lv.zone - 1].color, floor: lv.zone, boss: !!lv.boss, tests: lv.tests.length, perf: lv.tests.map(t => !!t.perf) });
function stageIt(i, keep) {
  plan = Scenes.plan(cur, i);
  World.showScene(plan.stage, Object.assign(meta(cur), { keep: !!keep }));
  const t = cur.tests[i];
  $('tag').textContent = 'Floor ' + cur.zone + ' · ' + cur.title + ' · test ' + (i + 1) + ' · ' + plan.type + (plan.type === plan.home ? '' : ' (fallback from ' + plan.home + ')');
  $('cap-call').textContent = t.stdout !== undefined ? (t.stdin ? 'typed: ' + String(t.stdin).split('\n').join(' ⏎ ') : 'the whole program') : String(t.show || t.call || '');
  caption(plan.stage.note, '');
  $('test').value = String(i);
}
function pick(id) {
  cur = CODE.find(l => l.id === id) || CODE[0];
  $('lv').value = cur.id;
  $('test').innerHTML = cur.tests.map((t, i) => '<option value="' + i + '">test ' + (i + 1) + (t.perf ? ' (speed)' : '') + '</option>').join('');
  stageIt(Scenes.choose(cur, null));
}
function resultsFor(kind) {
  if (kind === 'good') return Runner.run(cur, cur.solution);
  if (kind === 'starter') return Runner.run(cur, cur.starter);
  if (kind === 'bug') {
    const code = cur.solution.replace(/\s+$/, '') + '\n';
    for (const spot of Bugs.shuffled(Bugs.spots(code), Bugs.seeded(cur.id))) { let r = null; try { r = Runner.run(cur, Bugs.apply(code, spot).code, { quick: true }); } catch (e) { r = null; } if (r && !r.ok && r.tests.length) return r; }
    return Runner.run(cur, cur.starter);
  }
  return null;
}
// Plays one kind of answer on the level that is open. Resolves with what happened, for a script to read.
async function run(kind, opts) {
  opts = opts || {};
  if (busy) World.stop();
  busy = true;
  let res = null, i, result;
  if (String(kind).indexOf('junk') === 0) {
    const text = String(kind).slice(5) || 'None';
    i = opts.test !== undefined ? opts.test : plan.test;
    result = cur.tests[i].stdout !== undefined ? { ok: false, stdout: true, got: text } : { ok: false, got: text, full: text };
  } else {
    res = resultsFor(kind);
    i = opts.test !== undefined ? opts.test : res.tests.length ? Scenes.choose(cur, res.tests) : plan.test;
    result = res.tests.length ? res.tests[i] : { ok: false, error: res.error, errorLine: res.errorLine };
  }
  stageIt(i, true);
  const beats = Scenes.act(plan, result), notes = [], instant = opts.instant !== undefined ? opts.instant : $('instant').checked;
  $('log').textContent = 'got: ' + (result.error ? result.error.type : result.full !== undefined ? result.full : result.got) + '\nexpect: ' + (cur.tests[i].expect !== undefined ? cur.tests[i].expect : JSON.stringify(cur.tests[i].stdout)) + '\n\n' + beats.map(b => JSON.stringify(b)).join('\n');
  const done = await World.playScene(beats, { speed: opts.speed || Number($('speed').value), instant, note: (t, s) => { notes.push(t); caption(t, s); } });
  if (done && res && res.tests.length) await World.lightTests(res.tests.map(t => (t.ok ? 'pass' : t.slow ? 'slow' : 'fail')), instant);
  busy = false;
  return { done, type: plan.type, test: i, ok: !!result.ok, beats: beats.length, notes };
}
// A contact sheet: several scenes played to their end and laid side by side, to look over many at once.
// list: [[id, kind, test]], kind as for run(); without a kind the scene is shown as the level opens.
async function sheet(list, cols) {
  let box = $('sheet');
  if (!box) { box = document.createElement('div'); box.id = 'sheet'; document.body.appendChild(box); }
  box.style.cssText = 'position:fixed;inset:0;z-index:9;background:#02030a;display:grid;gap:4px;padding:4px;box-sizing:border-box;grid-template-columns:repeat(' + (cols || 3) + ',minmax(0,1fr));align-content:start;overflow:auto';
  box.innerHTML = '';
  for (const item of list) {
    pick(item[0]);
    if (item[2] !== undefined && !item[1]) stageIt(item[2]);
    let r = null;
    if (item[1]) r = await run(item[1], { instant: true, test: item[2] });
    await new Promise(res => setTimeout(res, 1100));
    await new Promise(res => requestAnimationFrame(res));
    const fig = document.createElement('figure'), img = new Image(), cap = document.createElement('figcaption');
    img.src = $('gl').toDataURL('image/jpeg', 0.85);
    img.style.cssText = 'display:block;width:100%';
    fig.style.cssText = 'margin:0;background:#0a0f20;border:1px solid #232d55';
    cap.style.cssText = 'font:11px/1.3 Consolas,monospace;color:#c5cdee;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    cap.textContent = cur.id + ' t' + (plan.test + 1) + ' ' + plan.type + (item[1] ? ' · ' + item[1] + (r ? (r.ok ? ' ✓' : ' ✗') : '') : '') + ' · ' + $('cap-text').textContent;
    fig.append(img, cap);
    box.append(fig);
  }
  return list.length;
}
window.dev = { pick, run, stageIt, sheet, ids: CODE.map(l => l.id), levels: CODE, get plan() { return plan; } };
$('lv').innerHTML = CODE.map(l => '<option value="' + l.id + '">F' + l.zone + '.' + l.order + ' ' + l.title + ' — ' + Scenes.MAP[l.id][0] + '</option>').join('');
$('lv').addEventListener('change', e => pick(e.target.value));
$('test').addEventListener('change', e => stageIt(Number(e.target.value)));
$('again').addEventListener('click', () => stageIt(plan.test));
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.run) run(b.dataset.run === 'junk' ? 'junk:None' : b.dataset.run);
  if (b.dataset.nav) { const k = CODE.indexOf(cur) + Number(b.dataset.nav); pick(CODE[(k + CODE.length) % CODE.length].id); }
});
World.init($('stage'), $('gl'), { levels: LEVELS, zones: ZONES }, { sfx() {} }).then(ok => {
  if (!ok) { $('log').textContent = 'WebGL did not start.'; return; }
  if (q.get('quality')) World.setQuality(q.get('quality'));
  pick(q.get('id') || CODE[0].id);
  if (q.get('t')) stageIt(Number(q.get('t')));
  window.dev.ready = true;
  if (q.get('run')) run(q.get('run'), { instant: !!q.get('instant'), test: q.get('t') ? Number(q.get('t')) : undefined });
});
</script>
</body>
</html>
